name: Update Metadata

on:
  schedule:
    # Runs twice a day at 04:00 UTC and 16:00 UTC (06:00 and 18:00 GMT+2)
    - cron: '0 4,16 * * *'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
	  cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Custom Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python custom.py

      - name: Run Database Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python database.py

      - name: Run Fandom Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python fandom.py

      - name: Run Judgment Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python judgment.py